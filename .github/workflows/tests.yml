name: Python package tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[tables,dev]'
      - run: python -m ruff check mgm2 tests examples
      - run: python -m ruff format --check mgm2 tests examples
      - run: python -m build --sdist
      - run: python -m pip wheel --no-deps --wheel-dir dist dist/*.tar.gz
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed artifact outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
          mgm2-embed --version
          mgm2-embed --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/
